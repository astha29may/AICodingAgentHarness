    descriptor: Readiness/boundary validators are not a servable endpoint
    content: When a task's definition of done requires serving traffic, deliver AND
      test the actual runtime request handler (a wired, invocable endpoint
      exercised by a request/response test), not only fail-closed boundary or
      composition-readiness validators. Green boundary tests can pass while no
      servable handler exists, hiding a completeness gap until code review.
    conflict_key: dod-servable-endpoint-vs-readiness-validator
