    descriptor: Run independent code-review before the evaluator scoring loop
    content: The CONTENT_FILTERED closed-contract drift survived all 3
      verification-evaluator iterations (feedback-002 even listed it as a
      resolved positive) and was only caught when code-review ran afterward.
      Semantic and contract-conformance defects escape weighted-rubric scoring
      but are caught by independent review. The fan-in should run @code-reviewer
      and clear drift/contract findings before entering the
      @verification-evaluator scoring loop, matching the orchestrator spec's
      stated order.
    conflict_key: code-review-before-evaluator-loop
